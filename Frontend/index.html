<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>BuildifyLabs</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Theme FOUC guard — applies the stored choice before first paint so
         a reload never flashes the wrong theme. Mirrors `theme-store.ts`
         (zustand persist shape); any parse failure falls back to the OS
         query via CSS. -->
    <script>
      try {
        var stored = localStorage.getItem('buildifylabs.theme');
        var theme = stored && JSON.parse(stored).state
          && JSON.parse(stored).state.theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) { /* system default via CSS */ }
    </script>
    <!-- Google Identity Services (F0 decision) — `google.accounts.id` is
         initialized by the Google sign-in screen in F1. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
