<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Tab/bookmark icons: versioned hrefs bust Chrome's aggressive
         favicon cache on every deploy (a stale "no icon" entry otherwise
         pins the default globe). SVG first (crisp at any size), small PNG
         fallback for renderers without SVG-icon support; the 1.6MB brand
         logo is deliberately NOT an icon candidate. -->
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0b" />
    <title>BuildifyLabs — Ask Your Business Data Anything</title>
    <meta
      name="description"
      content="BuildifyLabs is an AI business intelligence copilot: upload a CSV, PDF, or spreadsheet, ask in plain English, and get the right chart, the why behind it, and the exact query it came from. 4 free questions, no card to start."
    />
    <meta
      name="keywords"
      content="AI business intelligence, ask your data, CSV to chart, natural language SQL, SMB analytics, data copilot, BuildifyLabs"
    />
    <meta name="author" content="BuildifyLabs" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://buildifylabs.in/" />

    <!-- Open Graph (link previews: WhatsApp, LinkedIn, Facebook, Google) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="BuildifyLabs" />
    <meta property="og:title" content="BuildifyLabs — Ask Your Business Data Anything" />
    <meta
      property="og:description"
      content="Upload a spreadsheet, ask in plain English, and get the right chart, the why behind it, and the exact query it came from."
    />
    <meta property="og:url" content="https://buildifylabs.in/" />
    <meta property="og:image" content="https://buildifylabs.in/login.png" />
    <meta property="og:image:width" content="1536" />
    <meta property="og:image:height" content="1024" />
    <meta
      property="og:image:alt"
      content="BuildifyLabs — AI answers traced to real queries"
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="BuildifyLabs — Ask Your Business Data Anything" />
    <meta
      name="twitter:description"
      content="Upload a spreadsheet, ask in plain English, and get the right chart, the why behind it, and the exact query it came from."
    />
    <meta name="twitter:image" content="https://buildifylabs.in/login.png" />

    <!-- Structured data: organization + product -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "BuildifyLabs",
        "url": "https://buildifylabs.in/",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "description": "AI business intelligence copilot: upload business data, ask in plain English, get charts, explanations, and traceable queries.",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "publisher": { "@type": "Organization", "name": "BuildifyLabs", "url": "https://buildifylabs.in/" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Theme FOUC guard — applies the stored choice before first paint so
         a reload never flashes the wrong theme. Mirrors `theme-store.ts`
         (zustand persist shape); any parse failure falls back to the OS
         query via CSS. -->
    <script>
      try {
        var stored = localStorage.getItem('buildifylabs.theme');
        var theme = stored && JSON.parse(stored).state
          && JSON.parse(stored).state.theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) { /* system default via CSS */ }
    </script>
    <!-- Google Identity Services (F0 decision) — `google.accounts.id` is
         initialized by the Google sign-in screen in F1. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
